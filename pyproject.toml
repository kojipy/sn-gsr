[project]
name = "sn-gamestate"
version = "0.2.0"
description = "A Baseline and Framework for the SoccerNet Game State Reconstruction Challenge"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "tracklab==1.3.24",
    "easyocr==1.7.1",
    "soccernet==0.1.55",
    # lightning-cloud pulls in boto3 unpinned; without this floor the resolver
    # backtracks to a 2018-era boto3 whose vendored urllib3 breaks on Python 3.11
    # (`from collections import Mapping`). A modern botocore supports urllib3 2.x.
    "boto3>=1.34.0",
    # CUDA 12.8 build required for RTX 50-series (Blackwell, sm_120).
    "torch==2.8.0",
    "torchvision==0.23.0",
    "prtreid @ git+https://github.com/VlSomers/prtreid",
    "torchreid @ git+https://github.com/VlSomers/bpbreid",
    "lightning==2.0.9",
    "tracklab_calibration",
    "numpy==1.26.4",
    "transformers==4.35.2",
    "tokenizers==0.15.2",
]

[project.entry-points.tracklab_plugin]
sn_gamestate = "sn_gamestate.config_finder:ConfigFinder"

[project.scripts]
tracklab-cpu = "sn_gamestate.run_cpu:main"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sn_gamestate*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.rst", "*.yaml"]

[project.optional-dependencies]
dev = ["ipykernel==6.29.4"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
tracklab-calibration = { path = "plugins/calibration", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
